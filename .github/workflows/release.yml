name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub Release.
# The in-app updater (Settings › Updates) installs it from there; it checks the APK against SHA256SUMS.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forkcast-release.jks"
          echo "FORKCAST_KEYSTORE_FILE=$RUNNER_TEMP/forkcast-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          FORKCAST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FORKCAST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FORKCAST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Verify signature, name the APK, write SHA256SUMS
        run: |
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # Forkcast-vX.Y.Z.apk (roadmap 2.0); the in-app updater takes any .apk and checks it against SHA256SUMS.
          cp "$APK" "Forkcast-$GITHUB_REF_NAME.apk"
          sha256sum "Forkcast-$GITHUB_REF_NAME.apk" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; *) PRERELEASE="" ;; esac
          # Notes for users, written in .github/release-notes/<tag>.md; the commit list otherwise.
          NOTES=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "Forkcast-$GITHUB_REF_NAME.apk" SHA256SUMS             --title "Forkcast $VERSION" "${NOTES_ARGS[@]}" $PRERELEASE

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/forkcast-release.jks"
