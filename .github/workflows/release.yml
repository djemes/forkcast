name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub Release.
# Obtainium on the phone picks it up from there (SETUP.md Stage 6).
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forkcast-release.jks"
          echo "FORKCAST_KEYSTORE_FILE=$RUNNER_TEMP/forkcast-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          FORKCAST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FORKCAST_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FORKCAST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Verify signature and name the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "forkcast-$VERSION.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; *) PRERELEASE="" ;; esac
          gh release create "$GITHUB_REF_NAME" "forkcast-$VERSION.apk" \
            --title "Forkcast $VERSION" --generate-notes $PRERELEASE

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/forkcast-release.jks"
