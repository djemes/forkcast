name: Secret scan

# gitleaks over the full history of every branch (roadmap 2.0, Phase 5.1). Known false positives are in .gitleaksignore.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -sSfLO "$BASE/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan the full history
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --verbose .
