name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:

# A newer push to the same branch cancels the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug detekt --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: forkcast-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
