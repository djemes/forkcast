# Publishes site/ (homepage + privacy policy) to GitHub Pages at
# https://djemes.github.io/forkcast/. Manual only: Pages needs a public repo on the
# free plan, and this repo is private. While private, the live copy is the public
# repo djemes/forkcast-site (https://djemes.github.io/forkcast-site/); keep both in sync.
# To switch: make this repo public, set Settings › Pages › Source to "GitHub Actions",
# run this workflow, then update the two URLs on the Google Auth Platform Branding page.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
