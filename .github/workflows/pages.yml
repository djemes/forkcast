# Publishes site/ (homepage, install guide, privacy policy, terms) to GitHub Pages at
# https://djemes.github.io/forkcast/. Manual: run this workflow when INSTALL.md or site/ changes.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install guide from INSTALL.md
        run: python3 tools/site/build_install.py INSTALL.md site/install.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
